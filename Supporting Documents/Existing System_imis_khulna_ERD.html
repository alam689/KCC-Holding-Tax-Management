<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imis_khulna ERD</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#1a2230; --muted:#667085; --line:#d6dae1; --card:#ffffff;
  --accent:#2457d6; --e-fk:#1f4fd1; --e-data:#4b5565; --e-name:#c2700a;
  --cbg:55% 96%; --cbd:35% 80%; --cti:45% 30%; --hbg:55% 90%; --kbd:30% 68%;
  --shadow:0 1px 2px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#98a2b3; --line:#2d3542; --card:#1b212b;
    --accent:#8fb0ff; --e-fk:#7ea6ff; --e-data:#aab4c3; --e-name:#f0a84a;
    --cbg:25% 13%; --cbd:25% 26%; --cti:55% 78%; --hbg:30% 23%; --kbd:22% 36%;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.ttl{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ttl b{font-size:15px;letter-spacing:.01em}
.ttl span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--accent)}
#res{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none;z-index:20}
#res a{display:block;padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#res a:hover,#res a.on{background:var(--bg)}
#res a small{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{color:#0d1220}}
.seg button:not(.on):hover{background:var(--bg)}

#vp{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#e1{pointer-events:none}

.cluster{position:absolute;border:1.5px solid hsl(var(--h) var(--cbd));background:hsl(var(--h) var(--cbg));border-radius:18px}
.cluster h2{margin:0;padding:16px 26px 0;font-size:26px;font-weight:650;letter-spacing:-.01em;color:hsl(var(--h) var(--cti));white-space:nowrap}
.cluster h2 small{font-size:14px;font-weight:500;opacity:.75;margin-left:10px}

.card{position:absolute;width:250px;background:var(--card);border:1px solid hsl(var(--h) var(--kbd));border-radius:8px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.card .hd{height:36px;display:flex;align-items:center;gap:6px;padding:0 9px;background:hsl(var(--h) var(--hbg));border-bottom:1px solid hsl(var(--h) var(--kbd));cursor:move}
.card .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.card .kd{font-size:9px;font-weight:700;letter-spacing:.05em;padding:1px 4px;border-radius:4px;border:1px solid currentColor;opacity:.7}
.card .rc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{height:22px;display:flex;align-items:center;gap:5px;padding:0 9px;white-space:nowrap}
.row+.row{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.row .cn{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:30px}
.row.ispk .cn{font-weight:650}
.row .ct{margin-left:auto;padding-left:8px;color:var(--muted);font:11px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;flex:0 10 auto;min-width:0}
.b{flex:none;width:21px;height:14px;border-radius:3px;font:700 9px/14px system-ui,sans-serif;text-align:center;font-style:normal}
.b.pk{background:#d9a514;color:#231a00}
.b.fk{background:var(--e-fk);color:var(--panel)}
.b.data{border:1.5px solid var(--e-data);color:var(--e-data);line-height:11px}
.b.name{border:1.5px dotted var(--e-name);color:var(--e-name);line-height:11px}
.b.uq{border:1.5px solid var(--muted);color:var(--muted);line-height:11px}
.more{height:22px;line-height:22px;padding:0 9px;color:var(--muted);font-size:11px;border-top:1px dashed var(--line);cursor:pointer}
.more:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);text-decoration:underline}
.card.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:3}
.row[data-l]{cursor:pointer}
.row[data-l]:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row.csel{background:color-mix(in srgb,var(--accent) 26%,transparent)!important}
.row.csel .cn{font-weight:700}
.row.clink{background:color-mix(in srgb,#e0a812 38%,transparent)!important}
.row.clink .cn{font-weight:700}
.card.linked{outline:3px solid #e0a812;outline-offset:1px;z-index:3;box-shadow:0 0 0 7px color-mix(in srgb,#e0a812 22%,transparent)}
table.cols tr.on td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
table.cols a[data-pick]{font-weight:500}
/* copy buttons */
.row,.card .hd{position:relative}
.cp{display:none;align-items:center;justify-content:center;width:20px;height:18px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--muted);cursor:copy;flex:none}
.cp svg,#world .cp svg{position:static;width:12px;height:12px;overflow:hidden;pointer-events:none}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.card .cp{position:absolute;right:5px;top:50%;transform:translateY(-50%);box-shadow:-6px 0 6px var(--card)}
.card .hd .cp{background:hsl(var(--h) var(--hbg));box-shadow:-6px 0 6px hsl(var(--h) var(--hbg))}
.row:hover .cp,.card .hd:hover .cp{display:flex}
#panel{user-select:text;-webkit-user-select:text}
#panel .cp{display:inline-flex;vertical-align:-3px;margin-left:6px}
#pbody .cp{visibility:hidden}
#pbody tr:hover .cp{visibility:visible}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:40;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.has-sel .card:not(.rel){opacity:.22}
.has-sel .cluster{opacity:.55}
.has-sel #e0 .e{opacity:.07}

.e path{fill:none}
.e .ln,.e .en{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.e.fk .ln,.e.fk .en{stroke:var(--e-fk)}
.e.data .ln,.e.data .en{stroke:var(--e-data)}
.e.name .ln,.e.name .en{stroke:var(--e-name)}
.e.data .ln{stroke-dasharray:7 4}
.e.name .ln{stroke-dasharray:1.5 5}
.e .hit{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:help}
#e0 .e{opacity:.55}
#e0 .e:hover{opacity:1}
#e0 .e:hover .ln,#e0 .e:hover .en{stroke-width:2.6}
.e.hl .ln,.e.hl .en{stroke-width:2.6}

#legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:4;max-width:calc(100vw - 28px)}
#legend label{display:flex;align-items:center;gap:8px;padding:2px 0;cursor:pointer;white-space:nowrap}
#legend label b{margin-left:auto;padding-left:14px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
#legend svg{width:34px;height:10px;flex:none}
#legend .note{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:8px}
#legend .note svg{width:60px;height:14px}
.tools{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:4}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:34px;height:34px;padding:0 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tools button:hover{border-color:var(--accent)}

#panel{position:absolute;top:0;right:0;bottom:0;width:min(390px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .18s ease;z-index:6;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#panel header div{min-width:0;flex:1}
#panel h3{margin:0;font-size:16px;overflow-wrap:anywhere}
#panel header p{margin:3px 0 0;color:var(--muted);font-size:12px}
#panel header button{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
#pbody{overflow:auto;padding:4px 16px 20px}
#pbody h4{margin:16px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#pbody ul{list-style:none;margin:0;padding:0}
#pbody li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)}
#pbody li:first-child{border-top:0}
#pbody li>div{min-width:0;overflow-wrap:anywhere}
#pbody li small{display:block;color:var(--muted);font-size:11.5px}
#pbody a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
#pbody a:hover{text-decoration:underline}
.k{flex:none;margin-top:2px;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;white-space:nowrap}
.k.fk{background:var(--e-fk);color:var(--panel)}
.k.data{border:1px solid var(--e-data);color:var(--e-data)}
.k.name{border:1px dotted var(--e-name);color:var(--e-name)}
table.cols{width:100%;border-collapse:collapse;font-size:12.5px}
table.cols td{padding:3px 0;border-top:1px solid var(--line);vertical-align:top}
table.cols tr:first-child td{border-top:0}
table.cols td:nth-child(1){width:52px;white-space:nowrap}
table.cols td:nth-child(2){overflow-wrap:anywhere;padding-right:8px}
table.cols td:nth-child(3){color:var(--muted);font:11.5px ui-monospace,Consolas,monospace;text-align:right;overflow-wrap:anywhere}
table.cols .b{display:inline-block;margin-right:2px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:340px;display:none;z-index:30}
#tip small{display:block;opacity:.8}
</style>

let drag=null;
vp.addEventListener('pointerdown', e => {
  if (e.button!==0 || e.target.closest('#legend,.tools,#panel,.cp')) return;
  const card=e.target.closest('.card'), n=card && card.dataset.t, onHd=card && e.target.closest('.hd');
  const row=card && !onHd && e.target.closest('.row[data-l]'), col=row ? row.dataset.c : null;
  const more=card && e.target.closest('.more');
  drag={n, col, more:!!more, move:!!onHd, el:card, x:e.clientX, y:e.clientY, ox:onHd?pos[n].x:tx, oy:onHd?pos[n].y:ty, moved:false};
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if (!drag.moved && Math.hypot(dx,dy)<4) return;
  drag.moved=true;
  if (drag.move){
    const p={x:Math.round(drag.ox+dx/sc), y:Math.round(drag.oy+dy/sc)};
    manual[drag.n]=pos[drag.n]=p; drag.el.style.left=p.x+'px'; drag.el.style.top=p.y+'px';
    drawClusters(); drawEdges();
  } else { vp.classList.add('panning'); tx=drag.ox+dx; ty=drag.oy+dy; apply(); }
});
function endDrag(e){
  if (!drag) return;
  const d=drag; drag=null; vp.classList.remove('panning');
  if (d.moved) return;
  if (d.n && d.more) toggleExpand(d.n);
  else if (d.n && d.col) pickCol(d.n, d.col);
  else select(d.n ? (sel===d.n && !selCol ? null : d.n) : null);
}
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', () => { drag=null; vp.classList.remove('panning'); });

cardsEl.addEventListener('pointerover', e => { const c=e.target.closest('.card'); const n=c?c.dataset.t:null; if (n!==hov && !drag){ hov=n; if (!sel) drawTop(); } });
cardsEl.addEventListener('pointerleave', () => { hov=null; if (!sel) drawTop(); });

e0.addEventListener('pointermove', e => {
  const g=e.target.closest('.e'); if (!g || drag){ tip.style.display='none'; return; }
  const r=R[+g.dataset.i];
  tip.innerHTML=`<b>${esc(r.c)}.${esc(r.cc)} &rarr; ${esc(r.p)}.${esc(r.pc)}</b><small>${KN[r.k].toLowerCase()}${stat(r)?' · '+esc(stat(r)):''}</small>`;
  tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8)+'px'; tip.style.top=(e.clientY+16)+'px';
});
e0.addEventListener('pointerleave', () => { tip.style.display='none'; });
e0.addEventListener('pointerout', e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.e')) tip.style.display='none'; });

/* ---------- controls ---------- */
$('#zi').onclick = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.3);
$('#zo').onclick = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.3);
$('#fit').onclick = fit;
$('#rst').onclick = () => { manual={}; expanded.clear(); render(); fit(); };
$('#pc').onclick = () => select(null);
cardsEl.addEventListener('click', e => { const b=e.target.closest('.cp'); if (b){ e.stopPropagation(); copyFromBtn(b, e.shiftKey); } });
$('#ptc').innerHTML = CP_ICON;
$('#ptc').onclick = () => { if (sel) copyText(sel); };
$('#pbody').addEventListener('click', e => {
  const cb=e.target.closest('.cp'); if (cb){ copyFromBtn(cb, e.shiftKey); return; }
  const pk=e.target.closest('a[data-pick]'); if (pk){ pickCol(sel, pk.dataset.pick); return; }
  const a=e.target.closest('a[data-go]'); if (a) focusTable(a.dataset.go, a.dataset.col || null);
});
$('#mode').addEventListener('click', e => {
  const b=e.target.closest('button'); if (!b || b.dataset.m===mode) return;
  mode=b.dataset.m; manual={}; $('#mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  render(); if (sel) focusTable(sel); else fit();
});

const cnt = k => R.filter(r => k==='ward' ? r.ward : r.k===k).length;
const smp = k => `<svg class="e ${k}" viewBox="0 0 34 10"><path class="ln" d="M1,5H33"/></svg>`;
$('#legend').innerHTML =
  `<label><input type="checkbox" data-k="fk" checked>${smp('fk')}Declared foreign key<b>${cnt('fk')}</b></label>` +
  `<label><input type="checkbox" data-k="data" checked>${smp('data')}Inferred, confirmed in data<b>${cnt('data')}</b></label>` +
  `<label><input type="checkbox" data-k="name" checked>${smp('name')}Inferred from name only<b>${cnt('name')}</b></label>` +
  `<label><input type="checkbox" data-k="ward" checked><span style="width:34px"></span>Ward lookups (any kind)<b>${cnt('ward')}</b></label>` +
  `<div class="note"><svg class="e data" viewBox="0 0 60 14"><path class="en" d="M2,7H58M14,7L2,1M14,7L2,13M51,2V12"/></svg>many rows &rarr; one row</div>` +
  `<div class="note" style="display:block">Click a key column (PK / FK) to highlight<br>the tables and columns it links to.<br>Hover a name and click the copy icon to copy it<br>(Shift+click copies table.column).</div>`;
$('#legend').addEventListener('change', e => { const k=e.target.dataset.k; if (!k) return; show[k]=e.target.checked; drawEdges(); applySel(); });

const q=$('#q'), res=$('#res'); let hits=[], hi=0;
function search(){
  const s=q.value.trim().toLowerCase(); hits=[];
  if (s){
    const names=Object.keys(T).sort();
    names.forEach(n => { if (n.toLowerCase().includes(s)) hits.push({n, label:esc(n), sub:T[n].g.name}); });
    names.forEach(n => T[n].cols.forEach(c => { if (hits.length<60 && c.n.toLowerCase().includes(s)) hits.push({n, c:c.n, label:esc(n)+'.<b>'+esc(c.n)+'</b>', sub:c.t}); }));
  }
  hi=0;
  res.innerHTML = hits.length ? hits.map((h,i) => `<a data-i="${i}"${i===0?' class="on"':''}>${h.label} <small>${esc(h.sub)}</small></a>`).join('') : (s ? '<a><small>No matches</small></a>' : '');
  res.style.display = s ? 'block' : 'none';
}
function go(i){
  const h=hits[i]; if (!h) return; res.style.display='none'; q.blur();
  /* a searched column that is hidden in "Key columns" view: expand that table so it shows */
  if (h.c && mode==='keys' && !expanded.has(h.n) && !keyCols(T[h.n]).some(c => c.n===h.c)){ expanded.add(h.n); render(); }
  focusTable(h.n);
}
q.addEventListener('input', search);
q.addEventListener('focus', search);
q.addEventListener('keydown', e => {
  if (e.key==='Enter') go(hi);
  else if (e.key==='Escape'){ q.value=''; search(); q.blur(); }
  else if (e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if (!hits.length) return; hi=(hi+(e.key==='ArrowDown'?1:hits.length-1))%hits.length; res.querySelectorAll('a').forEach((a,i) => { a.classList.toggle('on', i===hi); if (i===hi) a.scrollIntoView({block:'nearest'}); }); }
});
res.addEventListener('pointerdown', e => { const a=e.target.closest('a[data-i]'); if (a){ e.preventDefault(); go(+a.dataset.i); } });
q.addEventListener('blur', () => setTimeout(() => { res.style.display='none'; }, 120));
addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
  else if (e.key==='Escape' && document.activeElement!==q) select(selCol ? sel : null);
  /* Ctrl/Cmd+C with nothing text-selected: copy the selected column (or table) name */
  else if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='c' && sel && document.activeElement!==q && !String(getSelection())){
    e.preventDefault(); copyText(selCol || sel);
  }
});
addEventListener('resize', () => { if (!sel) fit(); });

$('#dbn').textContent = D.db + ' — entity relationship diagram';
$('#stats').textContent = D.stats;
render(); fit();
</script>
</body>
</html>
